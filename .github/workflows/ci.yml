name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: Contract (lint + direct tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint the Intelligent Contract
        run: genvm-lint check contracts/by_example.py

      - name: Direct tests
        env:
          # Pin the GenVM release so the direct runner downloads the same
          # bundle the linter just used instead of resolving "latest" over the
          # GitHub API, which answers 404 for an older fallback tag.
          GENVM_VERSION: "v0.3.0-rc7"
        run: pytest tests/direct -x -vv --tb=long

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
